# GPU 功率固定分配守护程序 配置文件
# 修改后重启程序生效: systemctl restart gpu-power-service

[general]
# 分配模式（两种，切换后重启服务生效）：
#   count  = 简单模式(默认)：不判断活跃度，按"在线卡总数"查表，所有卡统一同档固定功率。
#            4卡->185W, 3卡->200W, 2卡->250W, 1卡->250W
#   active = 活跃模式：按"当前活跃(有负载)卡数"查表分配，空闲卡固定 power_idle 省电档
allocation_mode = count

# 检查/分配周期（秒）——自动分配评估 + 功率异常自愈纠偏节奏
check_interval = 60.0

# 活跃判定阈值：利用率 > 该值(%) 或 功耗 > 该值(W) 视为活跃卡
util_threshold = 5.0
power_threshold = 80.0

[power]
# 活跃卡数 -> 每卡固定分配功耗上限(W) 档位表（主人指定）：
#   4活跃卡 -> 185W/卡 | 3活跃卡 -> 200W/卡 | 2活跃卡 -> 250W/卡 | 1活跃卡 -> 250W/卡
# 注意：超过档位表最大卡数时自动取最保守档（多卡满载压最低）。
power_profile = 4:185, 3:200, 2:250, 1:250

# 单卡功耗硬上限(W)——安全风控：任何情况下单卡 power.limit 绝不超过此值（最大上限250W）
power_cap = 250.0

# 整机 GPU 功耗硬预算(W)——任意时刻所有卡功耗上限之和 ≤ 此值。
# 电源额定 1200W，预留 450W 给 CPU/内存/其他部件 -> GPU 预算 = 750W。
# 若电源额定或预留变化，按 "power_budget = 额定 − 预留" 调整即可。
power_budget = 750.0

# 空闲卡固定功耗上限(W)：仅在 allocation_mode=active 模式下生效（空闲无负载的卡保持此档省电）
power_idle = 100.0

# 自愈死区(W)：实际生效值与目标档位之差 < 该值视为正常，不反复下发（防 ±1W 抖动刷 -pl）
deadband = 2.0
