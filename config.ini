# GPU 空闲自动省电守护程序 配置文件
# 修改后重启程序生效

[general]
# 采样间隔（秒）——检查频率放缓，减少 nvidia-smi 调用开销
interval = 5.0

# 需要连续多少次空闲采样才进入省电态。
# 方案A：interval=5s 下取 12 次 × 5s = 60s 无负载才降功耗（保持与原 2s×30 相同的省电响应速度）
idle_samples = 12

# 需要连续多少次"忙"采样才从省电态恢复（唤醒也去抖）。
# 5s 下 3 次 × 5s = 15s 持续有负载才恢复满血，防止贴边震荡反复切换
busy_samples = 3

# 忙判定阈值：任一目标卡 利用率 > 该值（%） 或 功耗 > 该值（W） 即视为忙
busy_util_threshold = 5.0
busy_power_threshold = 80.0

# 管理的 GPU：all 表示探测全部；也可写 0,1,2 或 0-3
gpu_ids = all

[power]
# 省电态功耗上限（W）。设为 0 表示自动取每卡 min_limit
# 注意：不能低于每卡 power.min_limit，程序会自动 clamp
power_low = 100.0

# 每卡功耗硬上限（W）——安全风控！忙态动态分配、退出恢复等任何情况下，
# 单卡功率上限绝不允许超过此值（取 min(本值, 硬件max) 下发）。
# 当前策略：整场最大功耗锁定 250W（主人指定）。设为 0 表示不设额外上限（沿用硬件 max）。
power_cap = 250.0

# 整机 GPU 功耗硬预算（W）——安全关键！任意时刻所有卡的功耗上限之和绝不允许超过此值。
# 这是"显卡功率服务"防止超载的总上限：动态分配把(预算-空闲占用)由各忙卡均分，
# 数学上保证 各卡上限之和 ≤ 本值。
# 电源额定 1200W，预留 450W 给 CPU/内存/其他部件 -> 本机 GPU 预算 = 750W。
# 若电源额定或预留变化，按 "power_budget = 额定 − 预留" 调整即可。
power_budget = 750.0

# 动态分配下发死区（W）：目标功耗与当前生效值之差小于该值视为"微小调整"，
# 不立即下发；只有 差值≥死区 的重大变化（如忙闲迁移、负载突变）才会立刻执行。
# 防止忙卡 ±几瓦的反复抖动每 2 秒刷一次 nvidia-smi -pl（对硬件无害，但纯属无效开销）。
deploy_deadband = 10.0

# 微小调整的最短下发间隔（秒）：差值<死区时的再下发冷却；重大变化不受此限制，立即响应。
deploy_min_interval = 10.0

# 活跃卡数 -> 每卡满血功耗上限(W)档位表。动态分配按"当前忙卡数"查表给忙卡定档：
#   1忙/2忙 -> 250W, 3忙 -> 200W, 4忙 -> 185W（主人指定）。
# 平均分配/退出兜底(_restore_all) 也以此为准，且仍会被 power_budget/N 封顶不超整机预算。
power_budget_by_active = 4:185, 3:200, 2:250, 1:250
