# GPU 空闲自动省电守护程序 配置文件
# 修改后重启程序生效

[general]
# 采样间隔（秒）
interval = 2.0

# 需要连续多少次空闲采样才进入省电态。
# 默认 30 次 × 2s = 60s 无负载才降功耗（去抖，避免瞬时尖峰误伤）
idle_samples = 30

# 需要连续多少次"忙"采样才从省电态恢复（唤醒也去抖）。
# 默认 3 次 × 2s = 6s 持续有负载才恢复满血，防止贴边震荡反复切换
busy_samples = 3

# 忙判定阈值：任一目标卡 利用率 > 该值（%） 或 功耗 > 该值（W） 即视为忙
busy_util_threshold = 5.0
busy_power_threshold = 80.0

# 管理的 GPU：all 表示探测全部；也可写 0,1,2 或 0-3
gpu_ids = all

[power]
# 省电态功耗上限（W）。设为 0 表示自动取每卡 min_limit
# 注意：不能低于每卡 power.min_limit，程序会自动 clamp
power_low = 100.0

# 整机 GPU 功耗硬预算（W）——安全关键！任意时刻所有卡的功耗上限之和绝不允许超过此值。
# 这是"显卡功率服务"防止超载的总上限：动态智能分配把(预算-空闲占用)按各忙卡实际功耗
# 加权分给忙卡，数学上保证 各卡上限之和 ≤ 本值。
# 电源额定 1200W，预留 450W 给 CPU/内存/其他部件 -> 本机 GPU 预算 = 750W。
# 若电源额定或预留变化，按 "power_budget = 额定 − 预留" 调整即可。
power_budget = 750.0

# 恢复/退出兜底的"每卡满血档位"参考（仅用于 _restore_all 的保守恢复，动态分配不再用查表）。
# 格式："活跃卡数:每卡上限W, ..."。程序会再用 power_budget/N 封顶，即使 N 超过表的最大档也不超预算。
power_budget_by_active = 4:180, 3:200, 2:250, 1:300
